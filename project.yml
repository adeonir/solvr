name: Solvr

options:
  bundleIdPrefix: com.adeonir.labs
  deploymentTarget:
    macOS: "15.0"

packages:
  SolvrCore:
    path: .

targets:
  Solvr:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: SolvrCore
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Solvr
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
    settings:
      base:
        SWIFT_VERSION: "6.0"
