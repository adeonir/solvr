name: Solvr

options:
  bundleIdPrefix: dev.adeonir.labs
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
  projectFormat: "xcode27_0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode leaves the runtime flag off an ad-hoc Debug signature without it.
    OTHER_CODE_SIGN_FLAGS: "--options=runtime"

targets:
  Core:
    type: framework
    platform: macOS
    sources:
      - Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adeonir.labs.Core
        GENERATE_INFOPLIST_FILE: YES

  CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - CoreTests
    dependencies:
      - target: Core
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adeonir.labs.CoreTests
        GENERATE_INFOPLIST_FILE: YES

  Solvr:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - target: Core
    entitlements:
      path: App/Solvr.entitlements
      properties:
        # Library validation rejects the embedded Core framework when the signature is ad-hoc and carries no Team ID.
        com.apple.security.cs.disable-library-validation: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Solvr
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adeonir.labs.Solvr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    dependencies:
      - target: Solvr
      - target: Core
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.adeonir.labs.AppTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Solvr:
    build:
      targets:
        Solvr: all
        Core: all
    test:
      targets:
        - CoreTests
        - AppTests
