name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: xcode-27
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 27
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install tools
        run: brew install xcodegen swiftformat

      - name: Check Swift formatting
        run: sh scripts/check-swift-format.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Solvr for macOS
        run: xcodebuild -project Solvr.xcodeproj -scheme Solvr -destination 'platform=macOS' build CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Automatic

      - name: Run CoreTests and AppTests
        run: xcodebuild -project Solvr.xcodeproj -scheme Solvr -destination 'platform=macOS' test CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Automatic
